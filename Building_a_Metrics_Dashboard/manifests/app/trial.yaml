apiVersion: apps/v1
kind: Deployment
metadata:
  name: trial-app
  namespace: default
  labels:
    app: trial
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trial
  template:
    metadata:
      labels:
        app: trial
    spec:
      containers:
      - name: trial
        # Local image loaded into kind cluster
        image: trial:v1
        imagePullPolicy: IfNotPresent
        env:
        - name: JAEGER_AGENT_HOST
          value: "simplest-agent.observability.svc.cluster.local"
        - name: JAEGER_AGENT_PORT
          value: "6831"
        ports:
        - containerPort: 8080
          name: web
---
apiVersion: v1
kind: Service
metadata:
  name: trial-service
  namespace: default
  labels:
    app: trial
spec:
  selector:
    app: trial
  ports:
    - name: web
      port: 8080
      targetPort: 8080
  type: ClusterIP
