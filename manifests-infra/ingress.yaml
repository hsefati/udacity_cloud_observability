# ingress.yaml
# Ingress routing rules for Monitoring, Observability, and Application suites

# 1. Ingress for services in the 'monitoring' namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: observability-ingress
  namespace: monitoring
  annotations:
    # Disable automatic redirect to HTTPS for local HTTP development
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  # Route grafana.local -> prometheus-grafana:80
  - host: grafana.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-grafana
            port:
              number: 80
  # Route prometheus.local -> prometheus-kube-prometheus-prometheus:9090
  - host: prometheus.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: prometheus-kube-prometheus-prometheus
            port:
              number: 9090
---
# 2. Ingress for services in the 'observability' namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jaeger-ingress
  namespace: observability
  annotations:
    # Disable automatic redirect to HTTPS for local HTTP development
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  # Route jaeger.local -> simplest-query:16686 (Jaeger UI)
  - host: jaeger.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: simplest-query
            port:
              number: 16686
---
# 3. Ingress for applications in the 'default' namespace
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apps-ingress
  namespace: default
  annotations:
    # Disable automatic redirect to HTTPS for local HTTP development
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
  # Route frontend.local -> frontend-service:8080
  - host: frontend.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 8080
  # Route trial.local -> trial-service:8080
  - host: trial.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: trial-service
            port:
              number: 8080
  # Route backend.local -> backend-service:8080
  - host: backend.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 8080